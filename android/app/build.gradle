plugins { id 'com.android.application' }
android {
    namespace 'com.smartport.ps2engine'
    compileSdk 34
    defaultConfig {
        applicationId "com.smartport.ps2engine"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags "-std=c++20" } }
    }
    externalNativeBuild {
        cmake { path "../../CMakeLists.txt" }
    }
}
